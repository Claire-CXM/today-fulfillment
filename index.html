<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#155e52" />
    <meta name="description" content="今天的学习承诺，今天兑现。" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <title>今日兑现</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">TODAY, DELIVERED</p>
          <h1>今日兑现</h1>
        </div>
        <button class="date-chip" id="today-button" type="button" aria-label="回到今天"></button>
      </header>

      <section class="hero" aria-labelledby="daily-title">
        <div>
          <p class="eyebrow">今天的承诺</p>
          <h2 id="daily-title">把一件事，做到完成。</h2>
          <p id="daily-note">先写下计划，再开始专注。</p>
        </div>
        <div class="daily-score" aria-label="今日完成进度"><strong id="daily-score">0/0</strong><span>已完成</span></div>
      </section>

      <section class="focus-panel" id="focus-panel" hidden aria-live="polite">
        <div class="focus-heading"><span class="pulse"></span><span id="focus-title"></span><button class="text-button" id="focus-task-button" type="button">查看任务</button></div>
        <div class="timer" id="timer">00:00</div>
        <div class="focus-controls">
          <button class="button secondary" id="pause-button" type="button">暂停</button>
          <button class="button quiet" id="finish-button" type="button">完成任务</button>
        </div>
        <p class="pause-hint" id="pause-hint"></p>
      </section>

      <section class="section-heading">
        <div><p class="eyebrow">任务清单</p><h2>今天要兑现什么？</h2></div>
        <span class="counter" id="task-count">0 个任务</span>
      </section>
      <section id="task-list" class="task-list" aria-live="polite"></section>

      <section class="create-card" aria-labelledby="create-title">
        <div class="create-copy"><p class="eyebrow">新增任务</p><h2 id="create-title">给今天一个清晰目标</h2></div>
        <form id="task-form" novalidate>
          <label>学习内容<input id="task-title" name="title" maxlength="60" placeholder="例如：完成第 3 章习题" required /></label>
          <label>预计时长（分钟）<input id="task-minutes" name="minutes" type="number" min="1" max="1440" inputmode="numeric" placeholder="例如：45" required /></label>
          <p class="form-message" id="form-message" role="alert"></p>
          <button class="button primary" type="submit">加入今天</button>
        </form>
      </section>

      <section class="calendar-card" aria-labelledby="calendar-title">
        <div class="section-heading compact"><div><p class="eyebrow">本周足迹</p><h2 id="calendar-title">日历状态</h2></div></div>
        <div class="calendar-legend"><span><i class="dot green"></i>全部完成</span><span><i class="dot yellow"></i>部分完成</span><span><i class="dot red"></i>未完成</span></div>
        <div class="week" id="week-calendar"></div>
      </section>

      <section class="summary-card" aria-labelledby="summary-title">
        <p class="eyebrow">今日记录</p><h2 id="summary-title">专注的每一分钟都有迹可循</h2>
        <div class="summary-grid"><div><strong id="summary-focus">0 分钟</strong><span>已专注</span></div><div><strong id="summary-pauses">0 次</strong><span>普通暂停</span></div><div><strong id="summary-progress">0%</strong><span>整体进度</span></div></div>
        <p class="abandon-note" id="abandon-note"></p>
      </section>
    </main>

    <dialog id="node-dialog" class="modal"><form method="dialog" id="node-form"><div class="modal-head"><div><p class="eyebrow">节点</p><h2 id="node-dialog-title">拆分任务</h2></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div><p class="muted">最多 10 个节点。勾选后自动更新任务进度。</p><div id="node-list" class="node-editor"></div><button class="button outline" id="add-node-button" type="button">+ 添加节点</button><div class="modal-actions"><button class="button quiet" value="cancel">取消</button><button class="button primary" id="save-nodes-button" value="default">保存节点</button></div></form></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
